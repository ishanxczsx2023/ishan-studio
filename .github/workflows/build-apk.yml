name: Build Ishan Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/IshanStudio-v1.0.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IshanStudio-v1.0.1-APK
          path: dist/IshanStudio-v1.0.1.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.1
          name: Ishan Studio v1.0.1 (Official Android APK)
          body: |
            🚀 **Ishan Studio v1.0.1 Official Android APK**
            
            ### ✨ Features:
            - 🔴 **YouTube**: Real 4K Ultra HD (2160p), 1080p & 320kbps MP3
            - 🟣 **Instagram**: Reels & Video Downloader
            - 🟢 **TikTok**: Watermark-Free HD Videos
            - 🔴 **Pinterest**: Video Pins Downloader
            - 📝 **Full Video Transcript Generator**
            - 📱 **Native Android DownloadManager**
            
            ডাউনলোড করে যেকোনো অ্যান্ড্রয়েড ফোনে ইনস্টল করুন এবং বন্ধুদের পাঠিয়ে দিন!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
