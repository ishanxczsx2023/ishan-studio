name: Build Ishan Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/IshanStudio-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IshanStudio-v1.0-APK
          path: dist/IshanStudio-v1.0.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: Ishan Studio v1.0.0 (Official APK)
          body: |
            🚀 **Ishan Studio v1.0.0 is here!**
            
            ### ✨ Features:
            - 🔴 **YouTube**: Real 4K Ultra HD (2160p), 1080p & 320kbps MP3
            - 🟣 **Instagram**: Reels & Video Downloader
            - 🟢 **TikTok**: Watermark-Free HD Videos
            - 🔴 **Pinterest**: Video Pins Downloader
            - 📝 **Full Video Transcript Generator**
            - 📱 **Native Android DownloadManager**
            
            Install this APK directly on your Android phone and share with your friends!
          files: dist/IshanStudio-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
