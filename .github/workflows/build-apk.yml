name: Build Ishan Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/IshanStudio-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IshanStudio-v1.0.4-APK
          path: dist/IshanStudio-v1.0.4.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: Ishan Studio v1.0.4 (Zero Tech UI • Clean Edition)
          body: |
            🚀 **Ishan Studio v1.0.4 Official Android APK (Clean Edition)**
            
            ### ✨ What's New in v1.0.4:
            - 🔒 **100% Zero-Tech Clean UI**: লোকালহোস্ট, টার্মাক্স বা সার্ভার সেটিংসের জটিলতা সম্পূর্ণ হাইড করা হয়েছে—ইউজাররা শুধু গ্রিন 'Online' বাটন দেখতে পাবে!
            - 🟢 **Instant Status Toast**: 'Online' বাটনে চাপ দিলে শুধু "সার্ভার অনলাইন" টোস্ট দেখাবে, কোনো কনফিগারেশন পপআপ নয়।
            - 📋 **Native Android Clipboard**: এক ক্লিকে যেকোনো প্ল্যাটফর্মের লিঙ্ক ইনস্ট্যান্ট পেস্ট!
            - ⚡ **60 FPS & 4K High Bitrate**: হাই ফ্রেমরেট এবং হাই-কোয়ালিটি অডিও-ভিডিও মার্জিং।
            - 👑 **Creator Profiles Attached**: ঈশানের Instagram (@ishanxczs26) ও TikTok (@its_ishan_17) অফিশিয়াল ফলো বাটন!
            
            ডাউনলোড করে যেকোনো অ্যান্ড্রয়েড ফোনে ইনস্টল করুন এবং বন্ধুদের পাঠিয়ে দিন!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
