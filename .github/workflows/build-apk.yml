name: Build Ishan Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/IshanStudio-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IshanStudio-v1.0.5-APK
          path: dist/IshanStudio-v1.0.5.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: Ishan Studio v1.0.5 (Full English UI • TikTok & Reels Fix)
          body: |
            🚀 **Ishan Studio v1.0.5 Official Android APK (Full English UI)**
            
            ### ✨ What's New in v1.0.5:
            - 🌐 **100% Clean English UI**: All interfaces, labels, and buttons translated into crisp English per user request.
            - 📱 **TikTok & Instagram Format Fix**: Robust pre-muxed single-stream format selection (`best/b`) and automatic fallback logic so TikTok and Instagram videos download without `Requested format is not available` errors.
            - 🚫 **No Browser Alert Dialogs**: Completely removed disruptive `file://` alert popups and replaced them with smooth in-app toasts and styled error status cards.
            - 📋 **Native Clipboard Integration**: Instant one-tap paste via `@JavascriptInterface` Android bridge without browser permission prompts.
            - 👑 **Creator Profiles Attached**: Direct verified social follow cards for Ishan's Instagram (@ishanxczs26) and TikTok (@its_ishan_17).
            
            Download and install on any Android device!
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
